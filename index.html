<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>명탐정 VeRo, 화장품 광고 사전검토</title>
    <meta name="description" content="화장품 광고 PDF와 이미지를 올리면 법령 근거와 함께 위반 소지 문구를 찾아 주는 기업용 사전검토 서비스" />
    <!-- 기본은 검은 고양이. 앱이 뜨면 site.js의 MASCOT 설정에 맞는 아이콘으로 바꾼다 -->
    <link id="favicon" rel="icon" type="image/png" sizes="32x32" href="/brand/black/favicon-32.png" />
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/brand/black/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pretendard CSS와 글꼴 파일이 오는 곳. 연결을 미리 열어 글꼴 대기 시간을 줄인다 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 쓰는 아이콘만 받는다. 새 아이콘을 쓰면 icon_names에 알파벳 순서로 추가한다 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_circle,add_circle,approval,arrow_back,arrow_forward,article,block,check,check_circle,chevron_right,close,cloud_off,cloud_upload,code,delete,delete_sweep,description,download,draft,edit,edit_document,error,expand_less,expand_more,fact_check,gavel,help,history,home,hourglass_empty,image,image_search,info,language,layers,location_searching,logout,menu_book,open_in_new,picture_as_pdf,progress_activity,search,search_off,send,task_alt,toll,trending_up,unfold_more,verified,view_agenda,warning,zoom_in,zoom_out&display=block"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
